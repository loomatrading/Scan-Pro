name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 opencv-python numpy pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile `
          --add-data "rotate.png;." `
          --add-data "cleaner.png;." `
          --add-data "app_icon.ico;." `
          --icon=app_icon.ico `
          --name="ScanProAI" `
          app.py

    - name: Prepare Artifacts
      run: |
        mkdir release
        cp dist/ScanProAI.exe release/
        cp app_icon.ico release/ 2>$null || true

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScanProAI-Windows
        path: release/
