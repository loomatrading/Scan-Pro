name: Build Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 reportlab "opencv-python>=4.8" "Pillow>=10.0" "numpy>=1.24" "pyinstaller>=6.0"

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all PySide6 --collect-all reportlab --collect-all cv2 --collect-all PIL app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CamScanner-App
        path: dist/app/
